name: lzd_uplift
version: "1.0.0"
config-version: 2

profile: lzd_uplift

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Ngay logic - Airflow truyen vao bang --vars '{"run_date": "2026-08-05"}'
  run_date: "1970-01-01"

  # ── TAP DANH GIA DONG BANG ──────────────────────────────────────────────
  # `eval_holdout` loc theo `holdout_dt`, KHONG theo `run_date`. Chay dbt bao
  # nhieu lan cung ra dung bay nhieu dong.
  #
  # 🚫 Doi hai bien nay = moi so lieu lich su khong con so sanh duoc voi so
  #    lieu sau do. `promote.py` tu choi so hai run khac `holdout_version`,
  #    nen viec doi khong the xay ra am tham — nhung van phai la quyet dinh
  #    co chu dich, khong phai buoc bao tri.
  holdout_dt: "2026-08-05"
  holdout_version: "h_20260805"

  # Cua so truot cua `training_dataset`. Hanh vi mua sam troi theo mua nen
  # du lieu qua cu vua khong mo ta khach hang hien tai, vua lam bang phinh
  # vo han.
  training_window_weeks: 12
  # Cua so tinh feature realtime (giay) - PHAI khop voi TTL overlay tren Redis
  realtime_window_seconds: 3600
  # Cua so lich su cho feature batch
  history_days: 30
  # Semantic f30 van UNIDENTIFIED. Day chi la nhanh van hanh dang duoc test.
  f30_semantic_branch: "H1"
  counter_window_days: 365
  # PHAI khop config/reconstruction/runtime.yml:encoding_version.
  # Lech nhau => dbt production join encoding_map sai version => Gate A do
  # o production nhung xanh o harness (harness truyen version tuong minh).
  reconstruction_encoding_version: "encoding_2026_08_v2"

models:
  lzd_uplift:
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view
      +schema: staging

      # ── RECONSTRUCTION PATH ────────────────────────────────────────────
      # Doc `source('raw','events_v2')` — chi ton tai SAU khi Track A da ghi
      # event xuong lake. Xem chu thich o khoi `marts` ben duoi.
      stg_events_v2:
        +tags: ["reconstruction"]

    marts:
      +materialized: table
      +schema: marts

      # ── RECONSTRUCTION PATH ────────────────────────────────────────────
      # DAY LA DANH SACH DUY NHAT cua cac model thuoc duong reconstruction.
      #
      # Chung doc `source('biz', ...)` va `source('raw','events_v2')` — nhung
      # relation CHI ton tai sau khi Track A chay va writer da land du lieu.
      # Trong `dbt run` mac dinh (DAG 20) chung bi EXCLUDE, neu khong toan bo
      # build se do vi CatalogException va keo sap ca duong feature production.
      #
      #     DAG 20 (hang ngay):  dbt run --exclude tag:reconstruction
      #     Duong reconstruction: dbt run --select tag:reconstruction
      #
      # 🚫 Them model reconstruction moi ma quen tag o day => DAG 20 do lai.
      #    `test_dbt_reconstruction_tags.py` chan viec do bang cach doi chieu
      #    tag voi source that su duoc dung trong SQL.
      feat_cfs_counter:
        +tags: ["reconstruction"]
      feat_cfs_recency:
        +tags: ["reconstruction"]
      feat_cfs_categorical:
        +tags: ["reconstruction"]
      feat_passthrough:
        +tags: ["reconstruction"]

# Chay `dbt test` sau moi lan build - ket qua duoc DAG doc va ghi vao ops.dq_result
tests:
  lzd_uplift:
    +store_failures: true
    +schema: dq_failures
