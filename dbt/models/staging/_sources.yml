version: 2

sources:
  # ----------------------------------------------------------------------
  # RAW layer = parquet nam tren MinIO. dbt-duckdb doc truc tiep bang
  # read_parquet() nen KHONG phai copy du lieu vao warehouse -> giong het
  # cach BigQuery doc external table tren GCS.
  # ----------------------------------------------------------------------
  - name: raw
    description: "Data lake raw (MinIO) - chua bien doi gi"
    tables:
      - name: user_snapshot
        description: "Snapshot feature user hang ngay (nap tu CSV DESCN)"
        meta:
          external_location: "s3://lakehouse/raw/user_snapshot/**/*.parquet"
        columns:
          - name: user_id
            description: "Khoa entity - dan tu data_id"
            data_tests: [not_null]
          - name: label
            description: "1 = user co conversion"
          - name: is_treat
            description: "1 = user duoc phat voucher (treatment)"

      - name: app_events
        description: "Event tu Web/Mobile, do stream-consumer ghi xuong tu Kafka"
        meta:
          external_location: "s3://lakehouse/raw/app_events/**/*.parquet"
        columns:
          - name: event_id
            description: "Khoa de dedup (consumer la at-least-once nen co trung)"
          - name: user_id
          - name: event_ts
            description: "Epoch giay - thoi diem xay ra o client"

      - name: events_v2
        description: "Event Track A co provenance, tach khoi app_events v1"
        # Tag `reconstruction` de `dbt test --exclude tag:reconstruction` (DAG
        # 20) bo qua duoc. Prefix nay CHI ton tai sau khi Track A da land; khi
        # chua co, DuckDB nem `IO Error: No files found` chu khong pass rong,
        # nen 2 source test o duoi se lam do `dbt_test` moi ngay du chung
        # khong lien quan gi toi duong feature production.
        #
        # 🚫 Track B KHONG ghi vao day. No co prefix rieng
        # `raw/track_b_future/` va khong source dbt production nao doc —
        # xem `sink.publish_track_b_to_lake()`.
        tags: ["reconstruction"]
        meta:
          external_location: "s3://lakehouse/raw/events_v2/**/*.parquet"
        columns:
          - name: event_id
            data_tests: [not_null]
          - name: customer_id
            data_tests: [not_null]
          - name: target_id
          - name: generation_run_id

  # DuckDB production must attach/materialize these Postgres biz relations
  # before running the reconstruction models. The local E2E runner seeds the
  # same contracts in an isolated in-memory DuckDB database.
  - name: biz
    description: "Reconstruction control plane and decoded customer state"
    schema: biz
    tables:
      - name: reconstruction_boundary
      - name: customer_attribute
      - name: encoding_map
      - name: onehot_layout
      - name: passthrough_source
