version: 2

models:
  - name: feat_user_behaviour
    description: "Feature hanh vi 30 ngay tinh tu event stream"
    columns:
      - name: user_id
        tests: [not_null, unique]

  - name: feat_user_serving
    description: >
      Baseline/full snapshot feature mart. Khong phai nguon sync selected
      reconstruction feature store.
    columns:
      - name: user_id
        tests:
          - not_null
          - unique          # 1 dong / 1 user -> HSET len Redis khong dam nhau
      - name: dt
        tests: [not_null]
      - name: feature_ts
        tests: [not_null]
      - name: f0
        tests:
          - not_null
      - name: hist_gmv_30d
        tests:
          - not_null
          - dbt_utils_at_least_zero:
              config:
                severity: warn

  - name: feat_user_selected_serving
    description: >
      Selected 55-feature mart duoc sync len Redis theo feature_spec.yml
      (batch_features). Khong chua label/is_treat va khong sync f0..f82 day du.
    columns:
      - name: user_id
        tests:
          - not_null
          - unique
      - name: dt
        tests: [not_null]
      - name: feature_ts
        tests: [not_null]
      - name: f1
        tests: [not_null]
      - name: f82
        tests: [not_null]

  - name: feat_user_realtime_pit
    description: "Feature realtime tinh point-in-time de doi chieu voi Redis overlay"
    columns:
      - name: user_id
        tests: [not_null]
      - name: rt_events_1h
        tests: [not_null]

  - name: feat_cfs_reconstructed_selected
    description: >
      Mart audit hop nhat 55 selected feature sau reconstruction: 7 T1 tu
      event, 24 T2 tu attribute/encoding map va 24 T3 pass-through.
    columns:
      - name: target_id
        tests: [not_null, unique]
      - name: reference_ts
        tests: [not_null]
      - name: f1
        tests: [not_null]
      - name: f82
        tests: [not_null]
      - name: f35
        tests: [not_null]

  - name: feat_cfs_reconstructed_user_serving
    description: >
      Mart serving Track A: map target_id sang user_id va giu dung 55 feature
      reconstruction de sync DuckDB -> Redis.
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: dt
        tests: [not_null]
      - name: feature_ts
        tests: [not_null]
      - name: f1
        tests: [not_null]
      - name: f82
        tests: [not_null]
