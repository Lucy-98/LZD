version: 2

models:
  - name: training_features
    description: "Gold 1: exactly 30 f* columns reconstructed for model training."
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: dt
        data_tests: [not_null]
      - name: feature_ts
        data_tests: [not_null]
      - name: f1
        data_tests: [not_null]
      - name: f35
        data_tests: [not_null]

  - name: serving_features
    description: "Gold 2: 71 batch fields synced to Redis, including the immutable 30F vector."
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: dt
        data_tests: [not_null]
      - name: feature_ts
        data_tests: [not_null]
      - name: price_sensitivity_segment
        data_tests: [not_null]
      - name: user_tenure_days
        data_tests: [not_null]

  - name: training_dataset
    description: "PIT training view: 71 batch + 12 realtime fields plus outcomes."
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: label
        data_tests:
          - not_null
          - accepted_values: {values: [0, 1], quote: false}
      - name: is_treat
        data_tests:
          - not_null
          - accepted_values: {values: [0, 1], quote: false}
      - name: split
        data_tests:
          - accepted_values: {values: ['train'], quote: true}

  - name: feat_user_selected_serving
    description: "Legacy view alias of serving_features; not the active sync contract."

  - name: feat_user_realtime_pit
    description: "Offline PIT mirror for evaluation only; realtime serving uses Redis rt:u:*."
    columns:
      - name: user_id
        data_tests: [not_null]

  - name: feat_user_behaviour
    description: "Legacy behaviour mart retained for compatibility."
    columns:
      - name: user_id
        data_tests: [not_null, unique]
