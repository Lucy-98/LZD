lzd_uplift:
  target: dev
  outputs:
    dev:
      type: duckdb
      # DuckDB dong vai tro BigQuery. File nam tren volume dung chung.
      path: "{{ env_var('DUCKDB_PATH', '/opt/lakehouse/warehouse.duckdb') }}"
      threads: 1
      extensions:
        - httpfs
        - parquet
      settings:
        # Tro vao MinIO (S3-compatible)
        s3_endpoint: "{{ env_var('MINIO_ENDPOINT', 'http://minio:9000') | replace('https://', '') | replace('http://', '') }}"
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD', 'minioadmin123') }}"
        s3_use_ssl: false
        s3_url_style: "path"
        enable_progress_bar: false
        max_memory: "1.5GB"
        TimeZone: "UTC"
