# --------------------------------------------------------------------------
# 2) REALTIME FEATURES - stream consumer ghi Redis overlay sau khi persist
#    raw event xuong MinIO/lake. TTL ngan. Inference merge: batch <- overlay.
#    Ban cung tinh lai chinh xac cac cot nay trong dbt de train khong bi skew
#    (point-in-time join, xem models/marts/training_dataset.sql).
# --------------------------------------------------------------------------
realtime_features:
  - name: rt_events_1h
    dtype: int
    default: 0
    description: "Tong event trong 1 gio truot"
  - name: rt_page_view_1h
    dtype: int
    default: 0
  - name: rt_add_to_cart_1h
    dtype: int
    default: 0
  - name: rt_order_1h
    dtype: int
    default: 0
  - name: rt_gmv_1h
    dtype: float
    default: 0.0
  - name: rt_session_len_sec
    dtype: float
    default: 0.0
  - name: rt_last_event_ts
    dtype: int
    default: 0
    description: "Epoch giay cua event cuoi - dung do freshness cua overlay"

# --------------------------------------------------------------------------
# 3) Cot khong phai feature nhung di kem trong training set
# --------------------------------------------------------------------------
label_column: label            # 1 = conversion
treatment_column: is_treat     # 1 = duoc phat voucher

# --------------------------------------------------------------------------
# 4) Kiem tra chat luong ap dung cho feature
# --------------------------------------------------------------------------
quality:
  max_null_rate: 0.02          # >2% null tren 1 cot batch => FAIL
  max_freshness_hours: 26      # data cu hon 26h => FAIL (SLA daily + buffer)
  min_row_count: 1000
  # Sai lech tuong doi cho phep khi so gia tri offline vs online
  online_offline_tolerance: 0.0001
