# ==========================================================================
# FEATURE SPEC - contract cho selected feature store sync DuckDB -> Redis
# va realtime overlay. Muc dich: chong skew trong duong feature online.
#
#   - dbt build mart theo dung danh sach nay (test `columns_match_spec`).
#   - Sync job doc spec nay de biet ghi field nao len Redis.
#   - Inference API doc spec nay de biet doc field nao + default khi thieu.
#
# Doi feature => sua DUY NHAT file nay => bump `version` => pipeline tu align.
# ==========================================================================
version: 4
entity: user
entity_key: user_id

offline:
  # Bang mart trong DuckDB dung lam nguon sync Redis (tên nghiệp vụ).
  serving_table: marts.serving_features
  training_table: marts.training_dataset
  selected_feature_set_id: fs_2026_08_v3
  event_time_column: feature_ts
  partition_column: dt

online:
  # Key layout tren Redis:
  #   fs:{version}:u:{user_id}      -> HASH feature batch (ghi boi Airflow sync)
  #   rt:u:{user_id}                -> HASH realtime overlay (stream consumer ghi)
  #   fs:meta:active_version        -> STRING con tro version dang phuc vu
  #   fs:meta:{version}:status      -> HASH trang thai sync
  #   fs:meta:{version}:shards      -> SET shard da ghi xong (idempotency)
  #   fs:meta:versions              -> ZSET version theo timestamp (dung de GC)
  batch_key_template: "fs:{version}:u:{user_id}"
  realtime_key_template: "rt:u:{user_id}"
  meta_prefix: "fs:meta"
  stale_ttl_seconds: 86400
  realtime_ttl_seconds: 172800   # 48 gio: giu context hanh vi xuyen phien

# --------------------------------------------------------------------------
# 1) BATCH FEATURES - Tên nghiệp vụ, tinh hang ngay tu warehouse,
#    sync len Redis tai key fs:{version}:u:{user_id}
# --------------------------------------------------------------------------
batch_features:
