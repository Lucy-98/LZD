  - name: rt_page_view_5m
    dtype: int
    default: 0
    description: "So trang xem trong 5 phut"
  - name: rt_add_to_cart_5m
    dtype: int
    default: 0
    description: "So lan them gio hang trong 5 phut"
  - name: rt_cart_gmv_5m
    dtype: float
    default: 0.0
    description: "Tong tien gio hang trong 5 phut"
  - name: rt_search_cnt_5m
    dtype: int
    default: 0
    description: "So luot tim kiem trong 5 phut"

  # Cua so 1 gio (Near-Realtime Context)
  - name: rt_events_1h
    dtype: int
    default: 0
    description: "Tong event trong 1 gio truot"
  - name: rt_page_view_1h
    dtype: int
    default: 0
  - name: rt_add_to_cart_1h
    dtype: int
    default: 0
  - name: rt_order_1h
    dtype: int
    default: 0
  - name: rt_search_cnt_1h
    dtype: int
    default: 0
    description: "So luot tim kiem trong 1 gio"
  - name: rt_gmv_1h
    dtype: float
    default: 0.0
  - name: rt_session_len_sec
    dtype: float
    default: 0.0
  - name: rt_last_event_ts
    dtype: int
    default: 0
    description: "Epoch giay cua event cuoi"

# --------------------------------------------------------------------------
# 3) Cot khong phai feature nhung di kem trong training set
# --------------------------------------------------------------------------
label_column: label            # 1 = conversion
treatment_column: is_treat     # 1 = duoc phat voucher

# --------------------------------------------------------------------------
# 4) Kiem tra chat luong ap dung cho feature
# --------------------------------------------------------------------------
quality:
  max_null_rate: 0.02          # >2% null tren 1 cot batch => FAIL
  max_freshness_hours: 26      # data cu hon 26h => FAIL (SLA daily + buffer)
  min_row_count: 1000
  online_offline_tolerance: 0.0001
