# --------------------------------------------------------------------------
# 🚫 PHƯƠNG PHÁP BẮT BUỘC — §2.3
#
# CẤM dùng correlation để phát hiện encoding group.
# Bằng chứng: trong nhóm f79–f82 (ĐÃ CHỨNG MINH là MỘT biến 515 mức),
# tương quan cặp trải từ −0.99 đến +0.72; 3/6 cặp có |corr| < 0.5.
# Bộ lọc correlation chỉ bắt được 1/6 cặp.
# --------------------------------------------------------------------------
grouping_method: functional_dependency
grouping_rule: |
  card(tuple(A,B)) == card(A) == card(B)  ⇒ song ánh, MỘT tín hiệu
  card(tuple(A,B)) == card(A)             ⇒ B là hàm của A
  correlation                             ⇒ KHÔNG dùng

