# ==========================================================================
# BUSINESS ALIASES FOR SELECTED LZD FEATURES
#
# This file is a narrative bridge for the synthetic Lazada voucher-uplift
# project. It DOES NOT claim the real Lazada/DESCN semantic of f0..f82.
#
# Rules:
#   - Redis/dbt/model-facing names remain f1, f2, ...
#   - alias is a synthetic business name used in docs/reports.
#   - confidence must stay SYNTHETIC_ASSUMPTION unless the true source is known.
#   - T3 aliases are latent snapshot signals; they are not reconstructed events.
# ==========================================================================
version: business_aliases_2026_08_v3
