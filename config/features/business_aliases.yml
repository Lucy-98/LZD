    tier: T1
    alias: days_since_first_commerce_signal
    display_name: Days since first commerce signal
    business_role: Long-term relationship / customer lifecycle recency.
    source_family: recency
    confidence: SYNTHETIC_ASSUMPTION
    reconstruction_note: CFS recency marker; not proof of a real Lazada order event.

  f2:
    tier: T1
    alias: days_since_last_commerce_signal
