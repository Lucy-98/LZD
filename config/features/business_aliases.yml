track_a_event_aliases:
  EVT_F5:
    alias: ASSUMED_PRODUCT_VIEWED
    note: Presentation-only product view witness for f5; no product_id and not a proven Lazada event.
  EVT_F11:
    alias: ASSUMED_ITEM_ADDED_TO_CART
    note: Presentation-only add-to-cart witness for f11; no sku_id and not a proven Lazada event.
  EVT_F18:
    alias: ASSUMED_VOUCHER_VIEWED
    note: Presentation-only voucher-view witness for f18; no issuance_id and not a proven Lazada event.
  EVT_F19:
    alias: ASSUMED_VOUCHER_REDEEMED
    note: Presentation-only voucher-redemption witness for f19; no voucher/order FK and not a proven Lazada event.
  EVT_F30:
    alias: ASSUMED_APP_ACTIVE_DAY
    note: Presentation-only active-day marker for H2 f30; not used by H1 and not a raw domain event.
  EVT_ORDER_PAID:
    alias: ASSUMED_ORDER_PAID
    note: Presentation-only order-paid recency witness for f1/f2; no order_id and not a proven Lazada event.
  EVT_SESSION_STARTED:
    alias: ASSUMED_SESSION_STARTED
    note: Presentation-only session witness used to fill H1 active days; not a proven Lazada event.
