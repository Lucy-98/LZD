[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lzd-pipeline"
version = "0.1.0"
description = "LZD Uplift Feature Platform - Production-grade feature store, dbt pipeline, ML uplift serving & mathematically verified reconstruction"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "LZD Uplift Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "duckdb>=1.1.3",
    "redis>=5.1.1",
    "fakeredis>=2.25.1",
    "lupa>=2.8",
    "PyYAML>=6.0.2",
    "prometheus-client>=0.21.0",
    "python-json-logger>=2.0.7",
    "lightgbm>=4.7.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [
    "airflow/logs",
    "airflow/logs/*",
    ".venv",
    "venv",
    ".tmp",
    "dbt",
    "lakehouse",
    ".git",
    "__pycache__"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
